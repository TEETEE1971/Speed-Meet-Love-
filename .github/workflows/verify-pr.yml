name: Verify Speed Meet Love changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Build web app
        run: bun run build
