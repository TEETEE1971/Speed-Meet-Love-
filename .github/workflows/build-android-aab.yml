name: Android Build & Release Bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job 1: Verification (Runs on PRs and Pushes)
  # Strictly isolated: No access to release signing secrets
  verify:
    name: Verify Web & Android Codebase
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Web Dependencies
        run: bun install --frozen-lockfile

      - name: Verify Web TypeScript Types
        run: bun run lint

      - name: Build Web Application
        run: bun run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Verify Android Compilation (Debug Assemble)
        working-directory: android
        run: gradle assembleDebug --no-daemon

  # Job 2: Production AAB Build (Runs ONLY on Main Push or Manual Dispatch)
  # Excluded from pull requests to protect signing credentials
  build-release-aab:
    name: Build Signed Android Release Bundle (.aab)
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Validate GitHub Secrets for Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} - ANDROID_KEYSTORE_BASE64\n"
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} - KEYSTORE_PASSWORD\n"
          fi
          if [ -z "$KEY_ALIAS" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} - KEY_ALIAS\n"
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            MISSING_SECRETS="${MISSING_SECRETS} - KEY_PASSWORD\n"
          fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "=========================================================================="
            echo "ERROR: Missing required GitHub Secrets for Google Play release signing:"
            echo -e "$MISSING_SECRETS"
            echo "Release builds require your permanent upload keystore. Debug fallbacks"
            echo "and auto-generation are strictly disabled for security."
            echo ""
            echo "To configure these secrets:"
            echo "1. Go to your GitHub repository -> Settings -> Secrets and variables -> Actions"
            echo "2. Add the following repository secrets:"
            echo "   - ANDROID_KEYSTORE_BASE64: Base64-encoded upload keystore .jks file"
            echo "     (Generate via: base64 -w 0 your-upload-keystore.jks > keystore_base64.txt)"
            echo "   - KEYSTORE_PASSWORD: The password for your keystore file"
            echo "   - KEY_ALIAS: The key alias used when generating your upload key"
            echo "   - KEY_PASSWORD: The password for the key alias"
            echo "=========================================================================="
            exit 1
          fi

      - name: Decode Permanent Upload Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          if [ ! -s android/keystore/release.jks ]; then
            echo "ERROR: Decoded release keystore file is empty or corrupted."
            exit 1
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Signed Android App Bundle (.aab)
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Verify Signed .aab Output
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: .aab file was not found in android/app/build/outputs/bundle/release/"
            exit 1
          fi
          echo "Successfully created release bundle at: $AAB_FILE"
          ls -lh "$AAB_FILE"

      - name: Upload .aab Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speed-meet-love-production-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error
